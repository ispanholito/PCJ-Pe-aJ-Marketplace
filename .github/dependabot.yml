# Dependabot — PGC seção 13 (dependências de terceiros como itens de configuração)
# As atualizações chegam como PR e passam pelo mesmo CI e revisão dos demais.

version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
